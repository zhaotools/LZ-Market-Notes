name: Build and deploy Market Notes
on:
  push:
    branches: [main]
  schedule:
    # Primary syncs: 09:17 and 21:17 Asia/Shanghai; off the hour to reduce scheduler delay.
    - cron: '17 1,13 * * *'
    # Compensation retries: 10:07 and 22:07 Asia/Shanghai. No content change means no commit or deploy.
    - cron: '7 2,14 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Synchronize YouTube videos
        id: sync_youtube
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run sync:youtube
      - name: Synchronize market snapshot
        id: sync_market
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run sync:market
      - name: Synchronize WeChat articles
        id: sync_wechat
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run sync:wechat
      - name: Report synchronization warnings
        if: always() && github.event_name != 'push'
        env:
          YOUTUBE_RESULT: ${{ steps.sync_youtube.outcome }}
          MARKET_RESULT: ${{ steps.sync_market.outcome }}
          WECHAT_RESULT: ${{ steps.sync_wechat.outcome }}
        run: |
          echo "### Public content synchronization" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| YouTube | $YOUTUBE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| LZ-Map | $MARKET_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| WeChat | $WECHAT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$YOUTUBE_RESULT" != "success" ]; then
            echo "::warning title=YouTube synchronization failed::Verified existing video data was preserved; Map and WeChat synchronization continued."
          fi
          if [ "$MARKET_RESULT" != "success" ]; then
            echo "::warning title=Market synchronization failed::Verified existing market data was preserved; other sources continued."
          fi
          if [ "$WECHAT_RESULT" != "success" ]; then
            echo "::warning title=WeChat synchronization failed::Verified existing article data was preserved; other sources continued."
          fi
      - name: Build static files
        run: npm run build
      - name: Run data and template tests
        run: npm test
      - name: Verify public release readiness
        run: npm run release:check
      - name: Persist meaningful content changes
        id: content_changes
        if: github.event_name != 'push'
        run: |
          git add data site preview.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No public content changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update public content snapshots"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v6
        if: github.event_name == 'push' || steps.content_changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' || steps.content_changes.outputs.changed == 'true'
        with:
          path: site
      - name: Deploy
        id: deployment
        if: github.event_name == 'push' || steps.content_changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
