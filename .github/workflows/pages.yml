name: Build and deploy Market Notes
on:
  push:
    branches: [main]
  workflow_dispatch:
# Design-stage workflow: deploy the reviewed files in this repository.
# No source crawling, credential use, or scheduled synchronization is enabled.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build static files
        run: npm run build
      - name: Run data and template tests
        run: npm test
      - name: Verify public release readiness
        run: npm run release:check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
